name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o forge ./cmd/forge

      - name: Integration init
        run: |
          ./forge init ci-api --non-interactive --module github.com/forgekit/ci-api
          test -f ci-api/go.mod
          cd ci-api && go test ./...

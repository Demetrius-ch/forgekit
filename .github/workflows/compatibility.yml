name: Compatibility

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # go.mod sets the minimum Go version; older toolchains would only
        # download it, so the matrix covers operating systems.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o forge ./cmd/forge

      - name: Integration init
        run: |
          ./forge init compat-api --non-interactive --module github.com/forgekit/compat-api --skip-postprocess
          test -f compat-api/go.mod
          cd compat-api && go build ./...

# .github/workflows/apt.yml
# ForgeKit APT Repository Publishing Workflow
# Triggers on release publication, builds APT repository, signs it, and deploys to GitHub Pages

name: APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.3.0)'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apt-repo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: get_tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "Error: Could not determine release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ steps.get_tag.outputs.tag }} --repo ${{ github.repository }} --pattern 'forgekit_*_linux_amd64.deb' --dir artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Validate .deb exists
        run: |
          test -n "$(find artifacts -name 'forgekit_*_linux_amd64.deb' -print -quit)" || { echo "No .deb found in artifacts"; exit 1; }

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FORGEKIT_APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.FORGEKIT_APT_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import

      - name: Build APT repository structure
        run: |
          mkdir -p apt/pool/main/f/forgekit
          mkdir -p apt/dists/stable/main/binary-amd64
          mkdir -p apt/gpg

      - name: Copy GPG public key to repo structure
        run: |
          cp ${{ github.workspace }}/apt/gpg/forgekit-archive-keyring.gpg apt/gpg/forgekit-archive-keyring.gpg

      - name: Copy .deb to pool
        run: |
          cp artifacts/forgekit_*_linux_amd64.deb apt/pool/main/f/forgekit/forgekit_${{ steps.get_tag.outputs.tag }}_amd64.deb

      - name: Generate Packages
        run: |
          cd apt
          dpkg-scanpackages pool/main/f/forgekit /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz

      - name: Generate Release file
        run: |
          cd apt/dists/stable
          DATE=$(date -Ru)
          printf '%s\n' \
            "Origin: ForgeKit" \
            "Label: ForgeKit" \
            "Suite: stable" \
            "Codename: stable" \
            "Architectures: amd64" \
            "Components: main" \
            "Description: ForgeKit APT Repository" \
            "Date: $DATE" \
            > Release
          # Add hashes
          apt-ftparchive release . >> Release

      - name: Sign Release file (InRelease)
        env:
          GPG_PASSPHRASE: ${{ secrets.FORGEKIT_APT_GPG_PASSPHRASE }}
        run: |
          cd apt/dists/stable
          rm -f InRelease
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --clearsign -o InRelease Release

      - name: Copy public key to apt root for deployment
        run: |
          cp apt/gpg/forgekit-archive-keyring.gpg apt/forgekit-archive-keyring.gpg

      - name: Validate APT repository
        run: |
          test -f apt/dists/stable/Release
          test -f apt/dists/stable/InRelease
          test -f apt/dists/stable/main/binary-amd64/Packages
          test -f apt/dists/stable/main/binary-amd64/Packages.gz
          grep -q "forgekit_" apt/dists/stable/main/binary-amd64/Packages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo "APT repository deployed to ${{ steps.deployment.outputs.page_url }}"
          echo "Repository URL: https://demetrius-ch.github.io/forgekit/"
          echo "Key URL: https://demetrius-ch.github.io/forgekit/forgekit-archive-keyring.gpg"
          echo ""
          echo "Install with:"
          echo "  curl -fsSL https://demetrius-ch.github.io/forgekit/forgekit-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/forgekit-archive-keyring.gpg"
          echo "  echo \"deb [signed-by=/usr/share/keyrings/forgekit-archive-keyring.gpg] https://demetrius-ch.github.io/forgekit stable main\" | sudo tee /etc/apt/sources.list.d/forgekit.sources"
          echo "  sudo apt update && sudo apt install forgekit"
# .github/workflows/apt.yml
# ForgeKit APT Repository Publishing Workflow
# Triggers on release publication, builds APT repository, signs it, and deploys to GitHub Pages

name: APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apt-repo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.event.release.tag_name }} --repo ${{ github.repository }} --pattern '*_linux_amd64.deb' --dir artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FORGEKIT_APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.FORGEKIT_APT_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import

      - name: Copy public key to repo
        run: |
          cp apt/gpg/forgekit-archive-keyring.gpg ./forgekit-archive-keyring.gpg

      - name: Build APT repository structure
        run: |
          mkdir -p apt/pool/main/f/forge
          mkdir -p apt/dists/stable/main/binary-amd64
          mkdir -p apt/gpg

      - name: Copy .deb to pool
        run: |
          cp artifacts/forgekit_*_linux_amd64.deb apt/pool/main/f/forge/forge_${{ github.event.release.tag_name }}_amd64.deb

      - name: Generate Packages
        run: |
          cd apt
          dpkg-scanpackages pool/main/f/forge /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz

      - name: Generate Release file
        run: |
          cd apt/dists/stable
          DATE=$(date -Ru)
          printf '%s\n' \
            "Origin: ForgeKit" \
            "Label: ForgeKit" \
            "Suite: stable" \
            "Codename: stable" \
            "Architectures: amd64" \
            "Components: main" \
            "Description: ForgeKit APT Repository" \
            "Date: $DATE" \
            > Release
          # Add hashes
          apt-ftparchive release . >> Release

      - name: Sign Release file (InRelease)
        env:
          GPG_PASSPHRASE: ${{ secrets.FORGEKIT_APT_GPG_PASSPHRASE }}
        run: |
          cd apt/dists/stable
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --clearsign -o InRelease Release

      - name: Copy public key to repo root
        run: |
          cp apt/gpg/forgekit-archive-keyring.gpg ./forgekit-archive-keyring.gpg

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo "APT repository deployed to ${{ steps.deployment.outputs.page_url }}"
          echo "Repository URL: https://demetrius-ch.github.io/forgekit/"
          echo "Key URL: https://demetrius-ch.github.io/forgekit/forgekit-archive-keyring.gpg"
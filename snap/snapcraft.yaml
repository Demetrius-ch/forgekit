name: forgekit
title: ForgeKit
summary: Go CLI for generating, managing, analyzing and diagnosing backend APIs
description: |
  ForgeKit is a developer CLI written in Go that helps you bootstrap backend REST APIs
  without manually creating the same project structure, configuration, database integration,
  Docker files, migrations, and tests every time.

  It generates production-ready Go REST APIs with a clean hexagonal architecture,
  including PostgreSQL integration, Docker Compose, database migrations,
  environment configuration, and automatic tests.

  Features:
  - Project scaffolding with hexagonal architecture
  - PostgreSQL + Docker Compose + migrations
  - Feature system (forge add/remove): auth, cors, logging, swagger
  - Architecture validation (forge doctor, forge check, forge analyze)
  - Project inspection (forge inspect)
  - Extensible CLI with JSON output and CI modes

version: '0.3.4'
grade: stable
confinement: strict
base: core22

contact: forgekit@demetrius-ch.github.io
license: MIT
website: https://github.com/Demetrius-ch/forgekit
source-code: https://github.com/Demetrius-ch/forgekit
issues: https://github.com/Demetrius-ch/forgekit/issues

apps:
  forgekit:
    command: bin/forgekit
    plugs:
      - home
      - removable-media
      - network
      - network-bind
  forge:
    command: bin/forgekit
    plugs:
      - home
      - removable-media
      - network
      - network-bind

parts:
  forgekit:
    plugin: dump
    source: ..
    source-type: local
    organize:
      'forgekit': 'bin/forgekit'
    prime:
      - bin/forgekit
    build-packages:
      - ca-certificates
    override-build: |
      CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/Demetrius-ch/forgekit/internal/app.Version=$SNAPCRAFT_PROJECT_VERSION" -o $CRAFT_PART_INSTALL/bin/forgekit ./cmd/forge
      ln -sf forgekit $CRAFT_PART_INSTALL/bin/forge
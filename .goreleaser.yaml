# .goreleaser.yaml - ForgeKit Release Configuration
# This file controls how ForgeKit releases are built and published.
# Version is injected from git tag via ldflags.

version: 2

# Build configuration
builds:
  - id: forgekit
    main: ./cmd/forge
    binary: forgekit
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/Demetrius-ch/forgekit/internal/app.Version={{.Version}}
    flags:
      - -trimpath

# Archive configuration
archives:
  - id: forgekit
    ids:
      - forgekit
    formats:
      - tar.gz
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"

# Checksums
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Debian package via nfpm
nfpms:
  - id: forgekit-deb
    ids:
      - forgekit
    package_name: forgekit
    vendor: ForgeKit
    homepage: https://github.com/Demetrius-ch/forgekit
    maintainer: ForgeKit Maintainers <forgekit@demetrius-ch.github.io>
    description: |
      Go CLI for generating, managing, analyzing and diagnosing
      backend APIs.
      .
      Build production-ready REST APIs with hexagonal architecture.
      Scaffolds projects with PostgreSQL, Docker, migrations, tests.
      Provides: forge add, forge remove, forge doctor, forge analyze,
      forge check, forge inspect.
    license: MIT
    formats:
      - deb
    bindir: /usr/bin
    dependencies:
      - libc6
      - ca-certificates
    recommends:
      - docker.io
      - docker-compose-v2
    section: devel
    priority: optional
    epoch: "0"
    replaces:
      - forge
    provides:
      - forge
    file_name_template: "forgekit_{{.Version}}_{{.Os}}_{{.Arch}}"
    contents:
      - src: packaging/icons/hicolor/scalable/apps/forgekit.svg
        dst: /usr/share/icons/hicolor/scalable/apps/forgekit.svg
        type: file
        file_info:
          mode: 0644
      - src: packaging/com.forgekit.ForgeKit.metainfo.xml
        dst: /usr/share/metainfo/com.forgekit.ForgeKit.metainfo.xml
        type: file
        file_info:
          mode: 0644
      - src: forgekit
        dst: /usr/bin/forge
        type: symlink
        file_info:
          mode: 0755
      - src: debian/changelog.Debian.gz
        dst: /usr/share/doc/forgekit/changelog.Debian.gz
        type: file
        file_info:
          mode: 0644
      - src: debian/copyright
        dst: /usr/share/doc/forgekit/copyright
        type: file
        file_info:
          mode: 0644

# Release configuration
release:
  github:
    owner: Demetrius-ch
    name: forgekit
  draft: false
  prerelease: auto
  mode: replace
  name_template: "ForgeKit {{.Version}}"
  header: |
    # ForgeKit {{.Version}}

    ForgeKit is a Go CLI tool that generates production-ready REST APIs with hexagonal architecture.
  footer: |
    ---
    **Full Changelog**: https://github.com/Demetrius-ch/forgekit/compare/{{.PreviousTag}}...{{.Tag}}
    **Installation**: See [README](https://github.com/Demetrius-ch/forgekit#installation)
  disable: false

# Changelog configuration
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

# Before hooks for validation
before:
  hooks:
    - go mod tidy
ShortDescription: CLI to generate, extend and diagnose backend REST API projects
Description: |-
  ForgeKit is a command-line tool that scaffolds backend REST API projects with a consistent structure:
  folders, configuration, database integration, Docker files, migrations and tests.
  It can then add features to an existing project (authentication, CORS, logging, Swagger)
  and check its health and architecture with the doctor, check and analyze commands.
